<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulb Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bulb Controller</h1>
    <div id="connStatus" class="status idle">not connected</div>
  </header>

  <main>
    <section id="stage">
      <div id="bulbs"></div>
    </section>

    <section id="devices">
      <button id="connectBtn" type="button">Connect</button>
    </section>

    <section id="assistant">
      <div id="assistantLog"></div>
      <form id="aiForm">
        <input id="aiInput" type="text" placeholder="e.g. turn off the red bulb" autocomplete="off">
        <button id="aiMic" type="button" title="Voice input">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button id="aiSend" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
