<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulb Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bulb Controller</h1>
    <div id="connStatus" class="status idle">not connected</div>
  </header>

  <main>
    <section id="stage">
      <div id="bulbs"></div>
    </section>

    <section id="devices">
      <button id="connectBtn" type="button">Connect</button>
    </section>

    <section id="assistant">
      <div id="assistantLog"></div>
      <form id="aiForm">
        <input id="aiInput" type="text" placeholder="e.g. turn off the red bulb" autocomplete="off">
        <button id="aiSend" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
